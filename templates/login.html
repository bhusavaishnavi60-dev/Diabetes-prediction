<!DOCTYPE html>
<html>
<head>
    <title>Diabetes Prediction - Login</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
    <div class="card">

        <h1>🩺 Diabetes Prediction</h1>
        <h3>Login</h3>

        <form method="POST">

            <input type="text"
                   name="username"
                   placeholder="Enter Username"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Enter Password"
                   required>

            <button type="submit">Login</button>

        </form>

        <p>Don't have an account?</p>

        <a href="/signup" class="link-btn">Create Account</a>

    </div>
</div>

</body>
</html>

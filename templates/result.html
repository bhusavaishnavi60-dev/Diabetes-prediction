<!DOCTYPE html>
<html>
<head>
    <title>Prediction Result</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg">

<div class="container result-box">

    <h1>{{ result }}</h1>

    <h2>Prediction Confidence</h2>

    <div class="progress-bar">
        <div class="progress" style="width:{{ probability }}%;">
            {{ probability }}%
        </div>
    </div>

    <h2>🩺 Health Tips & Precautions</h2>

    <ul>
        {% for tip in precautions %}
        <li>{{ tip }}</li>
        {% endfor %}
    </ul>

    <a href="/home">
        <button>🔄 Predict Again</button>
    </a>

    <a href="/logout">
        <button class="logout-btn">Logout</button>
    </a>

</div>

</body>
</html>

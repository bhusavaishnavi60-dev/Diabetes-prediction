<!DOCTYPE html>
<html>
<head>
    <title>Diabetes Prediction</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
<div class="card">

<h2>Welcome {{username}}</h2>

<h3>Enter Patient Details</h3>

<form action="/predict" method="POST">

<label>Gender</label>
<select name="gender">
    <option value="Female">Female</option>
    <option value="Male">Male</option>
</select>

<label>Age</label>
<input type="number" name="age" required>

<label>Hypertension</label>
<select name="hypertension">
    <option value="0">No</option>
    <option value="1">Yes</option>
</select>

<label>Heart Disease</label>
<select name="heart_disease">
    <option value="0">No</option>
    <option value="1">Yes</option>
</select>

<label>Smoking History</label>
<select name="smoking_history">
    <option value="never">Never</option>
    <option value="current">Current</option>
    <option value="former">Former</option>
    <option value="No Info">No Info</option>
    <option value="ever">Ever</option>
    <option value="not current">Not Current</option>
</select>

<label>BMI</label>
<input type="number" step="0.1" name="bmi" required>

<label>HbA1c Level</label>
<input type="number" step="0.1" name="HbA1c_level" required>

<label>Blood Glucose Level</label>
<input type="number" name="blood_glucose_level" required>

<button type="submit">Predict Diabetes</button>

</form>

<br>

<a href="/logout" class="logout-btn">Logout</a>

</div>
</div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Home - Diabetes Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg">

<div class="container">

    <h1>🩺 Diabetes Prediction System</h1>
    <p>Enter Patient Health Details</p>

    <form action="/predict" method="POST">

        <div class="grid">

            <div>
                <label>Gender</label>
                <select name="gender">
                    <option>Male</option>
                    <option>Female</option>
                </select>

                <label>Age</label>
                <input type="number" name="age" required>

                <label>Hypertension</label>
                <select name="hypertension">
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>

                <label>Heart Disease</label>
                <select name="heart_disease">
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>
            </div>

            <div>
                <label>Smoking History</label>
                <select name="smoking_history">
                    <option>never</option>
                    <option>current</option>
                    <option>former</option>
                    <option>No Info</option>
                    <option>ever</option>
                    <option>not current</option>
                </select>

                <label>BMI</label>
                <input type="number" step="0.1" name="bmi" required>

                <label>HbA1c Level</label>
                <input type="number" step="0.1" name="HbA1c_level" required>

                <label>Blood Glucose Level</label>
                <input type="number" name="blood_glucose_level" required>
            </div>

        </div>

        <button class="predict-btn">🔍 Predict Diabetes</button>

    </form>

    <a href="/logout" class="logout">Logout</a>

</div>

</body>
</html>
